en:
  junction:
    views:
      entities:
        # Copy shared by every catalog kind. See Junction::EntityCopy for the
        # `%{kind}` interpolations.
        edit:
          title: Edit %{title}
          description: >-
            The same form backs create and edit: Junction stores the record
            itself, so there is no file being reconciled behind it.
        index:
          new: New %{kind}
          description: >-
            Filters live in the URL, so you can share a view by copying the URL.
          showing:
            one: Showing %{from}–%{to} of %{count} %{kind_lower}
            other: Showing %{from}–%{to} of %{count} %{kinds_lower}
          showing_none: Nothing to show yet
        new:
          title: New %{kind}
          description: >-
            Junction holds the catalog itself: a %{kind_lower} is created and
            edited here, not reconciled from somewhere else.
          source: Source
          soon: soon
          source_manual: Enter it manually
          source_manual_detail: >-
            Type the details in. Everything, including annotations.
          source_scan: Scan a repository
          source_scan_detail: Read junction.yaml from a repo and keep it in sync.
          source_import: Import YAML
          source_import_detail: Paste or upload a catalog file.
        show:
          overview: Overview
          dependencies: Dependencies
          dependents: Dependents
          graph: Graph
          annotations: Annotations
          annotations_edit: Edit
          no_annotations: No annotations yet
          # Followed by a relative time, as in "Updated 2 hours ago".
          updated: Updated
          more_actions: More actions
          edit: Edit %{kind}
          open_repo: Open repo
          stat_total_groups: Total Groups
          stat_total_systems: Total Systems
          stat_total_components: Total Components
          members: Members
          no_definition: No definition available.
