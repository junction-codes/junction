en:
  junction:
    components:
      entity:
        # Copy shared by every catalog kind. `%{kind}` names the kind
        # ("Component", "API"), `%{kind_lower}` names it mid-sentence
        # ("component", "API"), and `%{kinds}` / `%{kinds_lower}` are their
        # plurals. See Junction::EntityCopy.
        entity_edit_sidebar:
          metadata: Metadata
          danger_zone: Danger Zone
          danger_zone_warning: These actions are irreversible. Please be certain.
          delete: Delete %{kind}
          delete_confirm_title: Are you absolutely sure?
          delete_confirm_body: This will permanently remove the %{kind}.
          cancel: Cancel
          confirm_delete: Confirm Delete
        entity_tags_card:
          title: Tags & labels
          edit: Edit
          tags: Tags · %{count}
          labels: Labels · %{count}
          no_tags: No tags yet
          no_labels: No labels yet
          tags_note: Free-form and lowercase, for people to group things by.
          labels_note: Exact key/value pairs, for machines and plugins.
        entity_links_card:
          title: Links
          none: No links yet
        entity_dependencies_card:
          title: Dependencies
          depends_on: Depends on · %{count}
          used_by: Used by · %{count}
          depends_on_none: Depends on nothing
          used_by_none: Nothing depends on this %{kind_lower}
          more:
            one: "+ 1 more"
            other: "+ %{count} more"
        entity_ownership_card:
          title: Ownership
          members:
            one: 1 member
            other: "%{count} members"
        entity_tabs:
          label: Views of the %{kinds_lower}
          all: All
          mine: Mine
          production: Production
          recent: Recently changed
        entity_filters:
          add: + Add filter
          any: any
          clear: Clear filters
          remove: Remove the %{label} filter
          search: Search
          viewer: you and your groups
          # Keyed by the kind's `search_attribute`.
          placeholder:
            title_or_description_cont: Name or description…
            title_or_email_cont: Name or email address…
        entity_form:
          title: "%{kind} Details"
          description: >-
            This information will be displayed on the %{kind_lower}'s main page.
          namespace_help: >-
            Namespaces allow the same identifier to exist in different contexts.
          owner_help: Assign an owner for this %{kind_lower}.
          system_help: System this %{kind_lower} belongs to.
          domain_help: Assign this %{kind_lower} to an existing domain.
          description_help: A brief summary of the %{kind_lower}'s goals.
          mission_help: >-
            A brief, high-level summary of the %{kind_lower}'s mission.
          parent_help: Select a parent for this %{kind_lower}.
          nested_parent_help: >-
            Optionally nest this %{kind_lower} under a parent. Deleting a parent
            removes its child %{kinds_lower}.
          definition_help: "%{kind} spec definition."
          image_url_help: >-
            Optional URL for an image representing this %{kind_lower}.
          image_url_placeholder: https://example.com/logo.png
          tags_help: >-
            Lowercase, free-form, and what people filter and group by.
          labels_help: >-
            Exact-match pairs for machines to select on, not free text.
          links_help: >-
            Pages outside Junction. Another entity belongs in a relation.
          roles_title: Roles
          roles_description: >-
            Roles granted to this group. Members inherit them, along with the
            roles granted to any parent group.
          cancel: Cancel
          save: Save Changes
