        role_metadata_card:
          created: Created
          groups: Groups
          people: People
          title: Metadata
          updated: Updated
        role_form:
          filter: Filter by domain or context
          name_help: >-
            Seed data grants roles to groups by this identifier, and the system
            roles are recognized by it, so it cannot be changed once the role
            exists.
          selected: of %{total} selected
          show_everything: Show everything ↓
          plugin_contexts:
            one: 1 plugin registers its own
            other: "%{count} plugins register their own"
          showing_after: of %{total} contexts
          showing_before: Showing
          system_note: >-
            This role's permissions are resolved from what the engine and its
            plugins register, so they are shown here but cannot be edited.
          title: Role Details
          description: >-
            This information will be displayed on the role's main page.
          namespace_help: >-
            Namespaces allow the same identifier to exist in different contexts.
          cancel: Cancel
          save: Save Changes
