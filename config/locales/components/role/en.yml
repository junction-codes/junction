en:
  junction:
    components:
      role:
        role_permission_matrix:
          all: all
          context: Domain / context
          destroy: Destroy
          not_granted: Permission not granted
          not_registered: Permission not registered
          owned: owned
          read: Read
          write: Write
        role_changes_card:
          cancel: Cancel
          empty: No permission changes yet.
          save: Save changes
          title: Unsaved changes
        role_danger_card:
          cancel: Cancel
          confirm: Delete role
