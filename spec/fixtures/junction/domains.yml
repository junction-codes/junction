# These entities must have an owner. Specs sign in as user one, who is not a
# member of group two, so they are never owned by the signed in user, which the
# dashboard empty states rely on.
one:
  title: Domain One
  name: domain-one
  domain_type: product-area
  description: MyText
  image_url: https://example.com/image.png
  owner: two

two:
  title: Domain Two
  name: domain-two
  domain_type: product-group
  description: MyText
  image_url:
  owner: two
  parent: one
