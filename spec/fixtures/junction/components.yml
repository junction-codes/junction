# Components must have an owner. Specs sign in as user one, who is not a member
# of group two, so these components are never owned by the signed in user, which
# the dashboard empty states rely on.
one:
  title: Component One
  name: component-one
  description: MyText
  lifecycle: experimental
  component_type: api
  repository_url: MyString
  image_url: https://example.com/image.png
  owner: two

two:
  title: Component Two
  name: component-two
  description: MyText
  lifecycle: production
  component_type: worker
  repository_url: MyString
  image_url:
  owner: two
